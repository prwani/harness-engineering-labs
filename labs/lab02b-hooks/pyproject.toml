[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-lab02b-hooks"
version = "0.1.0"
description = "Lab 2B: Tool hooks and command policy"
requires-python = ">=3.11"
dependencies = [
  "azure-identity>=1.17,<2",
  "fastapi>=0.115,<1",
  "openai>=1.0,<3",
  "anthropic>=0.40,<1",
  "python-dotenv>=1,<2",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
harness = "harness.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["harness", "common"]

[tool.pytest.ini_options]
testpaths = ["checks"]
