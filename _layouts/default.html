<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}{% unless page.url == '/' %} · {{ site.title }}{% endunless %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle navigation" aria-expanded="true">
    <span></span><span></span><span></span>
  </button>

  <nav id="sidebar" class="sidebar">
    <a class="sidebar-brand" href="{{ '/' | relative_url }}">Harness Labs</a>
    <div class="sidebar-scroll">
      <ul class="sidebar-nav">
        <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a></li>
        <li><a href="{{ '/lab-outline.html' | relative_url }}"{% if page.url contains 'lab-outline' %} class="active"{% endif %}>Lab Outline</a></li>
      </ul>
      <div class="sidebar-section">Labs</div>
      <ul class="sidebar-nav">
        {% for lab in site.data.labs %}
        <li>
          <a href="{{ '/labs/' | append: lab.slug | append: '/README.html' | relative_url }}"{% if page.url contains lab.slug %} class="active"{% endif %}>
            <span class="lab-num">{{ lab.number }}</span>{{ lab.title }}
          </a>
        </li>
        {% endfor %}
      </ul>
    </div>
    <a class="sidebar-footer" href="https://github.com/{{ site.repository }}" target="_blank" rel="noopener">View source on GitHub ↗</a>
  </nav>

  <div class="page">
    <header class="topbar">
      <span class="topbar-title">{{ page.title | default: site.title }}</span>
    </header>
    <main class="content">
      {% unless page.url == '/' %}
      <a class="back-link" href="{{ '/' | relative_url }}">&larr; Back to labs index</a>
      {% endunless %}
      {{ content }}
    </main>
  </div>

  <div id="sidebar-scrim" class="sidebar-scrim"></div>
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
