title: Harness, Loop & Graph Engineering Labs
description: >-
  Self-contained Python lab snapshots for building an agent harness from a
  bare model call through tool loops, planning, memory, observability,
  background agents, loop engineering, and graph orchestration.
baseurl: "/harness-engineering-labs"
repository: prwani/harness-engineering-labs
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - "labs/app"
  - "labs/*/.venv"
  - "labs/*/.pytest_cache"
  - "labs/*/runs"
  - "labs/*/__pycache__"
  - "labs/*/*.egg-info"
  - "labs/*/.env"
  - "**/__pycache__"
  - "**/*.pyc"
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
